name: quality-gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and analytical controls
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=55
      - name: Full offline pipeline
        run: python main.py
      - name: Verify deliverables
        run: |
          test -s reports/executive_summary.md
          test -s reports/run_manifest.json
          test -s reports/figures/model_performance.png
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("data/credit_risk.db")
          assert db.execute("SELECT COUNT(*) FROM portfolio").fetchone()[0] > 50_000
          assert db.execute("SELECT SUM(is_new_default) FROM portfolio").fetchone()[0] > 0
          assert db.execute("PRAGMA foreign_key_check").fetchall() == []
          PY
      - name: Upload reports
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: analytics-reports
          path: reports/
